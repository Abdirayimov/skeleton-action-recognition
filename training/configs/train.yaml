data:
  # NTU-RGBD-60 .npz produced by prepare_ntu60.py.
  train_npz: data/processed/ntu60_xsub_train.npz
  val_npz: data/processed/ntu60_xsub_val.npz
  num_workers: 4
  batch_size: 64

model:
  in_channels: 3
  num_classes: 10
  num_keypoints: 17
  window_frames: 30
  hidden_channels: [64, 64, 128, 128, 256, 256]

optim:
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  epochs: 80
  warmup_epochs: 5
  scheduler: cosine

trainer:
  precision: 16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 25
  accumulate_grad_batches: 1

paths:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skeleton-ar-train"
version = "0.1.0"
description = "PyTorch Lightning training pipeline for ST-GCN on NTU-RGBD-60"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Khusan Abdirayimov", email = "khusanabdirayimov@gmail.com" },
]
dependencies = [
    "torch>=2.1",
    "lightning>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "onnx>=1.15",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.9",
    "black>=23.12",
    "mypy>=1.8",
    "pytest>=7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skeleton_ar_train"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
